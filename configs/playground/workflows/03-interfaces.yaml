---
steps:
  - type: get
    daemon: zebra
    description: |
      3. Interfaces lo STATE

      Аналог:

      vtysh:
      show interface lo json

      requestType:
      2 = STATE ONLY

      Это основной аналог show interface
      через gRPC/YANG tree.

      Для переносимости используется loopback interface lo,
      потому что он есть практически в любом Linux/container
      окружении.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-interface.yang
      root paths/libs:
      - /frr-interface:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Get <<'JSON'
      {
        "type": "STATE",
        "encoding": "JSON",
        "path": [
          "/frr-interface:lib/interface[name='lo']/state"
        ]
      }
      JSON
    params:
      requestType: 2
      path:
        - "/frr-interface:lib/interface[name='lo']/state"

  - type: assertJsonExists
    daemon: zebra
    description: |
      3. Interfaces lo STATE assert

      Проверка что gRPC реально вернул lo
      и основные operational state поля interface.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-interface.yang
      root paths/libs:
      - /frr-interface:lib

      Аналог:
      нет отдельной команды; это автоматическая проверка результата Get/GetCapabilities.

      grpcurl пример:
      assert step не имеет отдельного RPC; эквивалентный grpcurl смотри в Get step рядом.
    params:
      requestType: 2
      path:
        - "/frr-interface:lib/interface[name='lo']/state"
      checks:
        - path: 'frr-interface:lib.interface.#(name=="lo").name'
          equals: lo
        - path: 'frr-interface:lib.interface.#(name=="lo").state.if-index'
        - path: 'frr-interface:lib.interface.#(name=="lo").state.mtu'

  - type: createCandidate
    daemon: zebra
    description: |
      3. Interfaces CONFIG candidate

      ✅ Аналог:
      vtysh:
      configure terminal
    params: {}

  - type: editCandidate
    daemon: zebra
    description: |
      3. Interfaces CONFIG edit

      ✅ Аналог:
      vtysh:
      interface lo
       description TEST
       ip address 192.0.2.1/32
       shutdown
       no shutdown

      Важно:
      ip address и admin status находятся в augment:
      /frr-interface:lib/interface/.../frr-zebra:zebra
    params:
      update:
        - path: "/frr-interface:lib/interface[name='lo']/description"
          value: TEST
        - path: "/frr-interface:lib/interface[name='lo']/frr-zebra:zebra/ipv4-addrs[ip='192.0.2.1'][prefix-length='32']"
        - path: "/frr-interface:lib/interface[name='lo']/frr-zebra:zebra/enabled"
          value: 'false'
        - path: "/frr-interface:lib/interface[name='lo']/frr-zebra:zebra/enabled"
          value: 'true'

  - type: commitCandidate
    daemon: zebra
    description: |
      3. Interfaces CONFIG commit
    params:
      comment: configure interface lo description address admin-state

  - type: get
    daemon: zebra
    description: |
      3. Interfaces CONFIG read

      ✅ Аналог:
      vtysh:
      show running-config interface
    params:
      requestType: 1
      path:
        - "/frr-interface:lib/interface[name='lo']"

  - type: assertJsonExists
    daemon: zebra
    description: |
      3. Interfaces CONFIG assert
    params:
      requestType: 1
      path:
        - "/frr-interface:lib/interface[name='lo']"
      checks:
        - path: 'frr-interface:interface.#(name=="lo").description'
          equals: TEST
        - path: 'frr-interface:interface.#(name=="lo").frr-zebra:zebra.ipv4-addrs.#(ip=="192.0.2.1").ip'
          equals: 192.0.2.1
        - path: 'frr-interface:interface.#(name=="lo").frr-zebra:zebra.enabled'
          equals: 'true'

  - type: createCandidate
    daemon: zebra
    description: |
      3. Interfaces CONFIG cleanup candidate
    params: {}

  - type: editCandidate
    daemon: zebra
    description: |
      3. Interfaces CONFIG cleanup

      ✅ Аналог:
      vtysh:
      interface lo
       no ip address 192.0.2.1/32
       no description
    params:
      delete:
        - path: "/frr-interface:lib/interface[name='lo']/description"
        - path: "/frr-interface:lib/interface[name='lo']/frr-zebra:zebra/ipv4-addrs[ip='192.0.2.1'][prefix-length='32']"
        - path: "/frr-interface:lib/interface[name='lo']/frr-zebra:zebra/enabled"

  - type: commitCandidate
    daemon: zebra
    description: |
      3. Interfaces CONFIG cleanup commit
    params:
      comment: cleanup interface lo test config

  - type: get
    daemon: zebra
    description: |
      3. Interfaces CONFIG cleanup read
    params:
      requestType: 1
      path:
        - "/frr-interface:lib/interface[name='lo']"

  - type: assertJsonMissing
    daemon: zebra
    description: |
      3. Interfaces CONFIG cleanup assert
    params:
      requestType: 1
      path:
        - "/frr-interface:lib/interface[name='lo']"
      checks:
        - path: 'frr-interface:interface.#(name=="lo").description'
        - path: 'frr-interface:interface.#(name=="lo").frr-zebra:zebra.ipv4-addrs.#(ip=="192.0.2.1").ip'
        - path: 'frr-interface:interface.#(name=="lo").frr-zebra:zebra.enabled'
