---
steps:
  - type: get
    daemon: zebra
    description: |
      STEP 5

      Получение operational routing table (RIB).

      Аналог:

      vtysh:
      show ip route
      show ip route json

      Важно:
      routes находятся внутри:

      /frr-vrf:lib

      requestType:
      2 = STATE ONLY


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-vrf.yang
      root paths/libs:
      - /frr-vrf:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Get <<'JSON'
      {
        "type": "STATE",
        "encoding": "JSON",
        "path": [
          "/frr-vrf:lib"
        ]
      }
      JSON
    params:
      requestType: 2
      path:
        - "/frr-vrf:lib"
  - type: get
    daemon: staticd
    description: |
      STEP 6

      Чтение CONFIG static routes из staticd.

      Возвращает:
        - static routes
        - route-list
        - path-list
        - nexthops

      Используется для:
        - изучения структуры static routes
        - поиска required keys
        - изучения edit paths
        - проверки applied config

      Аналог через vtysh:

      show running-config

      Важно:
      requestType=1 используется специально,
      потому что requestType=0 иногда вызывает
      проблемы merge CONFIG + STATE
      в FRR mgmtd/staticd.

      requestType:
      1 = CONFIG ONLY


      Демон: staticd

      YANG/lib:
      endpoint: staticd / localhost:50053
      YANG modules:
      - frr-routing.yang
      root paths/libs:
      - /frr-routing:routing


      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50053 frr.Northbound/Get <<'JSON'
      {
        "type": "CONFIG",
        "encoding": "JSON",
        "path": [
          "/frr-routing:routing/control-plane-protocols"
        ]
      }
      JSON
    params:
      requestType: 1
      path:
        - "/frr-routing:routing/control-plane-protocols"
  - type: createCandidate
    daemon: staticd
    description: |
      STEP 7

      Создание candidate configuration session.

      Candidate configuration:
        - временная конфигурация
        - staging area
        - transaction buffer
        - изменения до commit

      Аналогично режиму:

      vtysh:
      configure terminal

      Но через:
        - gRPC
        - YANG
        - transaction model


      Демон: staticd

      YANG/lib:
      endpoint: staticd / localhost:50053
      YANG modules:
      - frr-staticd.yang
      root paths/libs: candidate создается без data path; edit paths идут в следующем EditCandidate step.


      grpcurl пример:
      grpcurl -plaintext -d '{}' localhost:50053 frr.Northbound/CreateCandidate
  - type: editCandidate
    daemon: staticd
    description: |
      STEP 8

      Создание static route через YANG edit.

      Создается:
        - route-list
        - prefix
        - src-prefix
        - afi-safi

      Аналог через vtysh:

      configure terminal
      ip route 10.10.10.0/24 192.168.1.1

      Важно:
      В FRR mgmtd/staticd nested YANG objects
      часто создаются нестабильно.

      Поэтому:
        - route-list
        - path-list
        - nexthop

      создаются отдельными шагами.

      Это НЕ ошибка workflow —
      это особенность FRR northbound/mgmtd.


      Демон: staticd

      YANG/lib:
      endpoint: staticd / localhost:50053
      YANG modules:
      - frr-routing.yang
      - frr-staticd.yang
      root paths/libs:
      - /frr-routing:routing


      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50053 frr.Northbound/EditCandidate <<'JSON'
      {
        "candidateId": 1,
        "update": [
          {
            "path": "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.10.10.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']",
            "value": "{\n\"prefix\": \"10.10.10.0/24\",\n\"src-prefix\": \"::/0\",\n\"afi-safi\": \"frr-routing:ipv4-unicast\"\n}\n"
          }
        ],
        "note": "пример укорочен; полный update/delete смотри в params шага"
      }
      JSON
    params:
      update:
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.10.10.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']"
          value: |
            {
            "prefix": "10.10.10.0/24",
            "src-prefix": "::/0",
            "afi-safi": "frr-routing:ipv4-unicast"
            }
  - type: editCandidate
    daemon: staticd
    description: |
      STEP 8.1

      Добавление path-list
      для static route.

      Создается:
        - table-id
        - distance
        - tag

      Аналог через vtysh:

      configure terminal
      ip route 10.10.10.0/24 192.168.1.1 1

      Важно:
      tag НЕ является key полем
      в YANG path-list.

      Поэтому:
        - table-id
        - distance

      используются в path predicates,

      а:
        - tag

      передается внутри value object.


      Демон: staticd

      YANG/lib:
      endpoint: staticd / localhost:50053
      YANG modules:
      - frr-routing.yang
      - frr-staticd.yang
      root paths/libs:
      - /frr-routing:routing


      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50053 frr.Northbound/EditCandidate <<'JSON'
      {
        "candidateId": 1,
        "update": [
          {
            "path": "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.10.10.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']/path-list[table-id='0'][distance='1']",
            "value": "{\n\"table-id\": 0,\n\"distance\": 1,\n\"tag\": 0\n}\n"
          }
        ],
        "note": "пример укорочен; полный update/delete смотри в params шага"
      }
      JSON
    params:
      update:
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.10.10.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']/path-list[table-id='0'][distance='1']"
          value: |
            {
            "table-id": 0,
            "distance": 1,
            "tag": 0
            }
  - type: editCandidate
    daemon: staticd
    description: |
      STEP 8.2

      Добавление nexthop
      для static route.

      Создается:
        - nh-type
        - gateway
        - vrf
        - interface

      Аналог через vtysh:

      configure terminal
      ip route 10.10.10.0/24 192.168.1.1

      Важно:
      path-list keys:
        - table-id
        - distance

      nexthop keys:
        - nh-type
        - gateway
        - vrf
        - interface

      tag НЕ является key.


      Демон: staticd

      YANG/lib:
      endpoint: staticd / localhost:50053
      YANG modules:
      - frr-routing.yang
      - frr-staticd.yang
      root paths/libs:
      - /frr-routing:routing


      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50053 frr.Northbound/EditCandidate <<'JSON'
      {
        "candidateId": 1,
        "update": [
          {
            "path": "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.10.10.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']/path-list[table-id='0'][distance='1']/frr-nexthops/nexthop[nh-type='ip4'][gateway='192.168.1.1'][vrf='default'][interface='']",
            "value": "{\n\"nh-type\": \"ip4\",\n\"gateway\": \"192.168.1.1\",\n\"vrf\": \"default\",\n\"interface\": \"\"\n}\n"
          }
        ],
        "note": "пример укорочен; полный update/delete смотри в params шага"
      }
      JSON
    params:
      update:
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.10.10.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']/path-list[table-id='0'][distance='1']/frr-nexthops/nexthop[nh-type='ip4'][gateway='192.168.1.1'][vrf='default'][interface='']"
          value: |
            {
            "nh-type": "ip4",
            "gateway": "192.168.1.1",
            "vrf": "default",
            "interface": ""
            }
  - type: commitCandidate
    daemon: staticd
    description: |
      STEP 10

      Commit candidate configuration.

      После commit:
        - candidate применяется
        - route попадает в running config
        - staticd передает route в zebra
        - zebra обновляет kernel routing

      Аналог через vtysh:

      exit
      write memory

      или:

      end
      write memory

      Используется transaction model:
        - prepare
        - validate
        - apply


      Демон: staticd

      YANG/lib:
      endpoint: staticd / localhost:50053
      YANG modules:
      - frr-staticd.yang
      root paths/libs: commit применяет candidate; data paths указаны в предыдущем EditCandidate step.


      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50053 frr.Northbound/Commit <<'JSON'
      {
        "candidateId": 1,
        "phase": "ALL",
        "comment": "add static route"
      }
      JSON
    params:
      comment: add static route
  - type: get
    daemon: staticd
    description: |
      STEP 11

      Проверка что static route появился
      в running configuration.

      Используется чтобы убедиться:
        - что commit успешно применился
        - что route-list существует
        - что path-list существует
        - что nexthop существует

      Это CONFIG verification,
      а не operational routing table.

      Аналог через vtysh:

      show running-config

      requestType:
      1 = CONFIG ONLY

      Важно:
      Читается control-plane-protocols tree,
      потому что direct route-list subtree path
      в FRR mgmtd/staticd может быть нестабилен.


      Демон: staticd

      YANG/lib:
      endpoint: staticd / localhost:50053
      YANG modules:
      - frr-routing.yang
      - frr-staticd.yang
      root paths/libs:
      - /frr-routing:routing


      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50053 frr.Northbound/Get <<'JSON'
      {
        "type": "CONFIG",
        "encoding": "JSON",
        "path": [
          "/frr-routing:routing/control-plane-protocols"
        ]
      }
      JSON
    params:
      requestType: 1
      path:
        - "/frr-routing:routing/control-plane-protocols"

  - type: assertJsonExists
    daemon: staticd
    description: |
      STEP 11.1

      Автоматическая проверка static route
      в running configuration после commit.

      Проверяет:
        - prefix
        - distance
        - nexthop gateway


      Демон: staticd

      YANG/lib:
      endpoint: staticd / localhost:50053
      YANG modules:
      - frr-routing.yang
      - frr-staticd.yang
      root paths/libs:
      - /frr-routing:routing

      Аналог:
      нет отдельной команды; это автоматическая проверка результата Get/GetCapabilities.

      grpcurl пример:
      assert step не имеет отдельного RPC; эквивалентный grpcurl смотри в Get step рядом.
    params:
      requestType: 1
      path:
        - "/frr-routing:routing/control-plane-protocols"
      checks:
        - path: 'frr-routing:control-plane-protocols.control-plane-protocol.#(name=="staticd").frr-staticd:staticd.route-list.#(prefix=="10.10.10.0/24").prefix'
          equals: 10.10.10.0/24
        - path: 'frr-routing:control-plane-protocols.control-plane-protocol.#(name=="staticd").frr-staticd:staticd.route-list.#(prefix=="10.10.10.0/24").path-list.0.distance'
          equals: 1
        - path: 'frr-routing:control-plane-protocols.control-plane-protocol.#(name=="staticd").frr-staticd:staticd.route-list.#(prefix=="10.10.10.0/24").path-list.0.frr-nexthops.nexthop.0.gateway'
          equals: 192.168.1.1

  - type: sleep
    daemon: zebra
    description: |
      STEP 12

      Небольшая пауза, чтобы staticd успел
      передать route в zebra RIB.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: нет прямого data-tree path.

      Аналог:
      нет; это пауза workflow runner.

      grpcurl пример:
      sleep step не имеет RPC; это пауза workflow runner.
    params:
      seconds: 1
  - type: get
    daemon: zebra
    description: |
      STEP 13

      Проверка что static route попал
      в operational RIB zebra.

      Аналог:

      vtysh:
      show ip route
      show ip route json

      requestType:
      2 = STATE ONLY


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-vrf.yang
      - frr-zebra.yang
      - frr-routing.yang
      root paths/libs:
      - /frr-vrf:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Get <<'JSON'
      {
        "type": "STATE",
        "encoding": "JSON",
        "path": [
          "/frr-vrf:lib/vrf[name='default']/frr-zebra:zebra/ribs/rib[afi-safi-name='frr-routing:ipv4-unicast'][table-id='254']/route[prefix='10.10.10.0/24']"
        ]
      }
      JSON
    params:
      requestType: 2
      withDefaults: false
      path:
        - "/frr-vrf:lib/vrf[name='default']/frr-zebra:zebra/ribs/rib[afi-safi-name='frr-routing:ipv4-unicast'][table-id='254']/route[prefix='10.10.10.0/24']"

  - type: assertJsonExists
    daemon: zebra
    description: |
      STEP 13.1

      Автоматическая проверка static route
      в operational RIB zebra после commit.

      Проверяет:
        - prefix
        - protocol static


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-vrf.yang
      - frr-zebra.yang
      - frr-routing.yang
      root paths/libs:
      - /frr-vrf:lib

      Аналог:
      нет отдельной команды; это автоматическая проверка результата Get/GetCapabilities.

      grpcurl пример:
      assert step не имеет отдельного RPC; эквивалентный grpcurl смотри в Get step рядом.
    params:
      requestType: 2
      withDefaults: false
      path:
        - "/frr-vrf:lib/vrf[name='default']/frr-zebra:zebra/ribs/rib[afi-safi-name='frr-routing:ipv4-unicast'][table-id='254']/route[prefix='10.10.10.0/24']"
      checks:
        - path: 'frr-vrf:lib.vrf.#(name=="default").frr-zebra:zebra.ribs.rib.#(afi-safi-name=="frr-routing:ipv4-unicast").route.#(prefix=="10.10.10.0/24").prefix'
          equals: 10.10.10.0/24
        - path: 'frr-vrf:lib.vrf.#(name=="default").frr-zebra:zebra.ribs.rib.#(afi-safi-name=="frr-routing:ipv4-unicast").route.#(prefix=="10.10.10.0/24").route-entry.0.protocol'
          equals: static

  - type: createCandidate
    daemon: staticd
    description: |
      STEP 14

      Создание candidate configuration session
      для cleanup static route.


      Демон: staticd

      YANG/lib:
      endpoint: staticd / localhost:50053
      YANG modules:
      - frr-staticd.yang
      root paths/libs: candidate создается без data path; edit paths идут в следующем EditCandidate step.

      Аналог:
      vtysh:
      configure terminal

      grpcurl пример:
      grpcurl -plaintext -d '{}' localhost:50053 frr.Northbound/CreateCandidate
  - type: editCandidate
    daemon: staticd
    description: |
      STEP 15

      Удаление static route из running configuration.

      Аналог через vtysh:

      configure terminal
      no ip route 10.10.10.0/24 192.168.1.1

      Удаляется весь route-list для тестового prefix,
      чтобы после workflow состояние вернулось обратно.


      Демон: staticd

      YANG/lib:
      endpoint: staticd / localhost:50053
      YANG modules:
      - frr-routing.yang
      - frr-staticd.yang
      root paths/libs:
      - /frr-routing:routing


      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50053 frr.Northbound/EditCandidate <<'JSON'
      {
        "candidateId": 1,
        "delete": [
          {
            "path": "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.10.10.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']"
          }
        ],
        "note": "пример укорочен; полный update/delete смотри в params шага"
      }
      JSON
    params:
      delete:
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.10.10.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']"

  - type: commitCandidate
    daemon: staticd
    description: |
      STEP 16

      Commit удаления static route.


      Демон: staticd

      YANG/lib:
      endpoint: staticd / localhost:50053
      YANG modules:
      - frr-staticd.yang
      root paths/libs: commit применяет candidate; data paths указаны в предыдущем EditCandidate step.

      Аналог:
      vtysh:
      end
      # изменения в vtysh применяются после config-команд

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50053 frr.Northbound/Commit <<'JSON'
      {
        "candidateId": 1,
        "phase": "ALL",
        "comment": "delete static route"
      }
      JSON
    params:
      comment: delete static route

  - type: get
    daemon: staticd
    description: |
      STEP 17

      Проверка running configuration после cleanup.

      Здесь читается весь control-plane-protocols tree,
      чтобы глазами увидеть что route-list 10.10.10.0/24
      больше не находится в staticd config.

      Аналог через vtysh:

      show running-config


      Демон: staticd

      YANG/lib:
      endpoint: staticd / localhost:50053
      YANG modules:
      - frr-routing.yang
      root paths/libs:
      - /frr-routing:routing


      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50053 frr.Northbound/Get <<'JSON'
      {
        "type": "CONFIG",
        "encoding": "JSON",
        "path": [
          "/frr-routing:routing/control-plane-protocols"
        ]
      }
      JSON
    params:
      requestType: 1
      path:
        - "/frr-routing:routing/control-plane-protocols"

  - type: assertJsonMissing
    daemon: staticd
    description: |
      STEP 17.1

      Автоматическая проверка что static route
      отсутствует в running configuration после cleanup.


      Демон: staticd

      YANG/lib:
      endpoint: staticd / localhost:50053
      YANG modules:
      - frr-routing.yang
      root paths/libs:
      - /frr-routing:routing

      Аналог:
      нет отдельной команды; это автоматическая проверка результата Get/GetCapabilities.

      grpcurl пример:
      assert step не имеет отдельного RPC; эквивалентный grpcurl смотри в Get step рядом.
    params:
      requestType: 1
      path:
        - "/frr-routing:routing/control-plane-protocols"
      checks:
        - path: 'frr-routing:control-plane-protocols.control-plane-protocol.#(name=="staticd").frr-staticd:staticd.route-list.#(prefix=="10.10.10.0/24").prefix'

  - type: sleep
    daemon: zebra
    description: |
      STEP 18

      Небольшая пауза, чтобы staticd успел
      убрать route из zebra RIB.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: нет прямого data-tree path.

      Аналог:
      нет; это пауза workflow runner.

      grpcurl пример:
      sleep step не имеет RPC; это пауза workflow runner.
    params:
      seconds: 1

  - type: get
    daemon: zebra
    description: |
      STEP 19

      Проверка operational RIB после cleanup.

      Здесь читается весь IPv4 unicast RIB default VRF,
      чтобы глазами увидеть что тестовый prefix
      10.10.10.0/24 больше не установлен.

      Аналог:

      vtysh:
      show ip route
      show ip route json


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-vrf.yang
      - frr-zebra.yang
      - frr-routing.yang
      root paths/libs:
      - /frr-vrf:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Get <<'JSON'
      {
        "type": "STATE",
        "encoding": "JSON",
        "path": [
          "/frr-vrf:lib/vrf[name='default']/frr-zebra:zebra/ribs/rib[afi-safi-name='frr-routing:ipv4-unicast'][table-id='254']"
        ]
      }
      JSON
    params:
      requestType: 2
      withDefaults: false
      path:
        - "/frr-vrf:lib/vrf[name='default']/frr-zebra:zebra/ribs/rib[afi-safi-name='frr-routing:ipv4-unicast'][table-id='254']"

  - type: assertJsonMissing
    daemon: zebra
    description: |
      STEP 19.1

      Автоматическая проверка что static route
      отсутствует в operational RIB zebra после cleanup.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-vrf.yang
      - frr-zebra.yang
      - frr-routing.yang
      root paths/libs:
      - /frr-vrf:lib

      Аналог:
      нет отдельной команды; это автоматическая проверка результата Get/GetCapabilities.

      grpcurl пример:
      assert step не имеет отдельного RPC; эквивалентный grpcurl смотри в Get step рядом.
    params:
      requestType: 2
      withDefaults: false
      path:
        - "/frr-vrf:lib/vrf[name='default']/frr-zebra:zebra/ribs/rib[afi-safi-name='frr-routing:ipv4-unicast'][table-id='254']"
      checks:
        - path: 'frr-vrf:lib.vrf.#(name=="default").frr-zebra:zebra.ribs.rib.#(afi-safi-name=="frr-routing:ipv4-unicast").route.#(prefix=="10.10.10.0/24").prefix'

  - type: createCandidate
    daemon: staticd
    description: |
      STEP 20

      Extra static routes candidate.

      ✅ Аналог:
      vtysh:
      ip route 10.20.20.0/24 192.168.1.1 10
      ip route 10.30.30.0/24 192.168.1.1 tag 100
      ipv6 route 2001:db8:100::/64 2001:db8::1
    params: {}

  - type: editCandidate
    daemon: staticd
    description: |
      STEP 21

      Создание дополнительных IPv4/IPv6 static routes.
    params:
      update:
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.20.20.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']"
          value: |
            {
            "prefix": "10.20.20.0/24",
            "src-prefix": "::/0",
            "afi-safi": "frr-routing:ipv4-unicast"
            }
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.20.20.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']/path-list[table-id='0'][distance='10']"
          value: |
            {
            "table-id": 0,
            "distance": 10,
            "tag": 0
            }
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.20.20.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']/path-list[table-id='0'][distance='10']/frr-nexthops/nexthop[nh-type='ip4'][gateway='192.168.1.1'][vrf='default'][interface='']"
          value: |
            {
            "nh-type": "ip4",
            "gateway": "192.168.1.1",
            "vrf": "default",
            "interface": ""
            }
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.30.30.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']"
          value: |
            {
            "prefix": "10.30.30.0/24",
            "src-prefix": "::/0",
            "afi-safi": "frr-routing:ipv4-unicast"
            }
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.30.30.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']/path-list[table-id='0'][distance='1']"
          value: |
            {
            "table-id": 0,
            "distance": 1
            }
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.30.30.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']/path-list[table-id='0'][distance='1']/tag"
          value: "100"
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.30.30.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']/path-list[table-id='0'][distance='1']/frr-nexthops/nexthop[nh-type='ip4'][gateway='192.168.1.1'][vrf='default'][interface='']"
          value: |
            {
            "nh-type": "ip4",
            "gateway": "192.168.1.1",
            "vrf": "default",
            "interface": ""
            }
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='2001:db8:100::/64'][src-prefix='::/0'][afi-safi='frr-routing:ipv6-unicast']"
          value: |
            {
            "prefix": "2001:db8:100::/64",
            "src-prefix": "::/0",
            "afi-safi": "frr-routing:ipv6-unicast"
            }
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='2001:db8:100::/64'][src-prefix='::/0'][afi-safi='frr-routing:ipv6-unicast']/path-list[table-id='0'][distance='1']"
          value: |
            {
            "table-id": 0,
            "distance": 1,
            "tag": 0
            }
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='2001:db8:100::/64'][src-prefix='::/0'][afi-safi='frr-routing:ipv6-unicast']/path-list[table-id='0'][distance='1']/frr-nexthops/nexthop[nh-type='ip6'][gateway='2001:db8::1'][vrf='default'][interface='']"
          value: |
            {
            "nh-type": "ip6",
            "gateway": "2001:db8::1",
            "vrf": "default",
            "interface": ""
            }

  - type: commitCandidate
    daemon: staticd
    description: |
      STEP 22
      Commit extra static routes.
    params:
      comment: add extra static routes

  - type: get
    daemon: staticd
    description: |
      STEP 23

      ✅ Аналог:
      vtysh:
      show running-config
    params:
      requestType: 1
      path:
        - "/frr-routing:routing/control-plane-protocols"

  - type: assertJsonExists
    daemon: staticd
    description: |
      STEP 23.1
      Assert extra static routes in config.
    params:
      requestType: 1
      path:
        - "/frr-routing:routing/control-plane-protocols"
      checks:
        - path: 'frr-routing:control-plane-protocols.control-plane-protocol.#(name=="staticd").frr-staticd:staticd.route-list.#(prefix=="10.20.20.0/24").path-list.0.distance'
          equals: 10
        - path: 'frr-routing:control-plane-protocols.control-plane-protocol.#(name=="staticd").frr-staticd:staticd.route-list.#(prefix=="10.30.30.0/24").path-list.0.tag'
          equals: 100
        - path: 'frr-routing:control-plane-protocols.control-plane-protocol.#(name=="staticd").frr-staticd:staticd.route-list.#(prefix=="2001:db8:100::/64").path-list.0.frr-nexthops.nexthop.0.gateway'
          equals: 2001:db8::1

  - type: sleep
    daemon: zebra
    description: |
      STEP 24
      Wait for zebra RIB update.
    params:
      seconds: 1

  - type: get
    daemon: zebra
    description: |
      STEP 25

      ✅ Аналог:
      vtysh:
      show ip route static
      show ipv6 route
      show ipv6 route json
    params:
      requestType: 2
      withDefaults: false
      path:
        - "/frr-vrf:lib/vrf[name='default']/frr-zebra:zebra/ribs"

  - type: createCandidate
    daemon: staticd
    description: |
      STEP 26
      Cleanup extra static routes candidate.
    params: {}

  - type: editCandidate
    daemon: staticd
    description: |
      STEP 27

      Cleanup extra static routes.
    params:
      delete:
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.20.20.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']"
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='10.30.30.0/24'][src-prefix='::/0'][afi-safi='frr-routing:ipv4-unicast']"
        - path: "/frr-routing:routing/control-plane-protocols/control-plane-protocol[type='frr-staticd:staticd'][name='staticd'][vrf='default']/frr-staticd:staticd/route-list[prefix='2001:db8:100::/64'][src-prefix='::/0'][afi-safi='frr-routing:ipv6-unicast']"

  - type: commitCandidate
    daemon: staticd
    description: |
      STEP 28
      Commit cleanup extra static routes.
    params:
      comment: cleanup extra static routes

  - type: get
    daemon: staticd
    description: |
      STEP 29
      Read config after extra route cleanup.
    params:
      requestType: 1
      path:
        - "/frr-routing:routing/control-plane-protocols"

  - type: assertJsonMissing
    daemon: staticd
    description: |
      STEP 29.1
      Assert extra static routes removed.
    params:
      requestType: 1
      path:
        - "/frr-routing:routing/control-plane-protocols"
      checks:
        - path: 'frr-routing:control-plane-protocols.control-plane-protocol.#(name=="staticd").frr-staticd:staticd.route-list.#(prefix=="10.20.20.0/24").prefix'
        - path: 'frr-routing:control-plane-protocols.control-plane-protocol.#(name=="staticd").frr-staticd:staticd.route-list.#(prefix=="10.30.30.0/24").prefix'
        - path: 'frr-routing:control-plane-protocols.control-plane-protocol.#(name=="staticd").frr-staticd:staticd.route-list.#(prefix=="2001:db8:100::/64").prefix'
