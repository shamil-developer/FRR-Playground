---
steps:
  - type: get
    daemon: zebra
    description: |
      STEP 29

      Чтение текущих route-map до изменений.

      Аналог:

      vtysh:
      show route-map

      Используется чтобы:
        - изучить YANG tree route-map
        - посмотреть текущие entries
        - проверить match/set rules
        - понять keys/predicates

      requestType:
      1 = CONFIG ONLY

      Важно:
      Route-map находятся внутри:

      /frr-route-map:lib


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Get <<'JSON'
      {
        "type": "CONFIG",
        "encoding": "JSON",
        "path": [
          "/frr-route-map:lib"
        ]
      }
      JSON
    params:
      requestType: 1
      path:
        - "/frr-route-map:lib"

  - type: createCandidate
    daemon: zebra
    description: |
      STEP 30

      Создание candidate transaction
      для route-map изменений.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: candidate создается без data path; edit paths идут в следующем EditCandidate step.

      Аналог:
      vtysh:
      configure terminal

      grpcurl пример:
      grpcurl -plaintext -d '{}' localhost:50051 frr.Northbound/CreateCandidate
  - type: editCandidate
    daemon: zebra
    description: |
      STEP 31

      Создание route-map TEST permit 10.

      Аналог:

      vtysh:
      configure terminal
      route-map TEST permit 10

      Важно:
      В YANG route-map entry key:
        - sequence

      А action является mandatory leaf,
      поэтому задается отдельным update.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/EditCandidate <<'JSON'
      {
        "candidateId": 1,
        "update": [
          {
            "path": "/frr-route-map:lib/route-map[name='TEST']/entry[sequence='10']/action",
            "value": "permit"
          }
        ],
        "note": "пример укорочен; полный update/delete смотри в params шага"
      }
      JSON
    params:
      update:
        - path: "/frr-route-map:lib/route-map[name='TEST']/entry[sequence='10']/action"
          value: permit

  - type: commitCandidate
    daemon: zebra
    description: |
      STEP 32

      Commit создания route-map TEST permit 10.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: commit применяет candidate; data paths указаны в предыдущем EditCandidate step.

      Аналог:
      vtysh:
      end
      # изменения в vtysh применяются после config-команд

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Commit <<'JSON'
      {
        "candidateId": 1,
        "phase": "ALL",
        "comment": "create route-map TEST permit 10"
      }
      JSON
    params:
      comment: create route-map TEST permit 10

  - type: createCandidate
    daemon: zebra
    description: |
      STEP 33

      Создание candidate transaction
      для добавления match rule.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: candidate создается без data path; edit paths идут в следующем EditCandidate step.

      Аналог:
      vtysh:
      configure terminal

      grpcurl пример:
      grpcurl -plaintext -d '{}' localhost:50051 frr.Northbound/CreateCandidate
  - type: editCandidate
    daemon: zebra
    description: |
      STEP 34

      Добавление match правила
      в route-map TEST permit 10.

      Аналог:

      vtysh:
      route-map TEST permit 10
      match ip address prefix-list TEST7

      В YANG:
        - condition = frr-route-map:ipv4-prefix-list
        - list-name = TEST7


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/EditCandidate <<'JSON'
      {
        "candidateId": 1,
        "update": [
          {
            "path": "/frr-route-map:lib/route-map[name='TEST']/entry[sequence='10']/match-condition[condition='frr-route-map:ipv4-prefix-list']/rmap-match-condition/list-name",
            "value": "TEST7"
          }
        ],
        "note": "пример укорочен; полный update/delete смотри в params шага"
      }
      JSON
    params:
      update:
        - path: "/frr-route-map:lib/route-map[name='TEST']/entry[sequence='10']/match-condition[condition='frr-route-map:ipv4-prefix-list']/rmap-match-condition/list-name"
          value: TEST7

  - type: commitCandidate
    daemon: zebra
    description: |
      STEP 35

      Commit match правила route-map.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: commit применяет candidate; data paths указаны в предыдущем EditCandidate step.

      Аналог:
      vtysh:
      end
      # изменения в vtysh применяются после config-команд

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Commit <<'JSON'
      {
        "candidateId": 1,
        "phase": "ALL",
        "comment": "add route-map match rule"
      }
      JSON
    params:
      comment: add route-map match rule

  - type: createCandidate
    daemon: zebra
    description: |
      STEP 36

      Создание candidate transaction
      для добавления set action.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: candidate создается без data path; edit paths идут в следующем EditCandidate step.

      Аналог:
      vtysh:
      configure terminal

      grpcurl пример:
      grpcurl -plaintext -d '{}' localhost:50051 frr.Northbound/CreateCandidate
  - type: editCandidate
    daemon: zebra
    description: |
      STEP 37

      Добавление set действия
      в route-map TEST permit 10.

      Аналог:

      vtysh:
      route-map TEST permit 10
      set metric 100

      В YANG:
        - action = frr-route-map:set-metric
        - value = 100


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/EditCandidate <<'JSON'
      {
        "candidateId": 1,
        "update": [
          {
            "path": "/frr-route-map:lib/route-map[name='TEST']/entry[sequence='10']/set-action[action='frr-route-map:set-metric']/rmap-set-action/value",
            "value": "100"
          }
        ],
        "note": "пример укорочен; полный update/delete смотри в params шага"
      }
      JSON
    params:
      update:
        - path: "/frr-route-map:lib/route-map[name='TEST']/entry[sequence='10']/set-action[action='frr-route-map:set-metric']/rmap-set-action/value"
          value: "100"

  - type: commitCandidate
    daemon: zebra
    description: |
      STEP 38

      Commit set действия route-map.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: commit применяет candidate; data paths указаны в предыдущем EditCandidate step.

      Аналог:
      vtysh:
      end
      # изменения в vtysh применяются после config-команд

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Commit <<'JSON'
      {
        "candidateId": 1,
        "phase": "ALL",
        "comment": "add route-map set action"
      }
      JSON
    params:
      comment: add route-map set action

  - type: get
    daemon: zebra
    description: |
      STEP 39

      Проверка что route-map TEST
      содержит permit 10, match и set.

      Аналог:

      vtysh:
      show route-map


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Get <<'JSON'
      {
        "type": "CONFIG",
        "encoding": "JSON",
        "path": [
          "/frr-route-map:lib"
        ]
      }
      JSON
    params:
      requestType: 1
      path:
        - "/frr-route-map:lib"

  - type: assertJsonExists
    daemon: zebra
    description: |
      STEP 39.1

      Автоматическая проверка что route-map TEST
      содержит entry 10, match prefix-list TEST7
      и set metric 100.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      Аналог:
      нет отдельной команды; это автоматическая проверка результата Get/GetCapabilities.

      grpcurl пример:
      assert step не имеет отдельного RPC; эквивалентный grpcurl смотри в Get step рядом.
    params:
      requestType: 1
      path:
        - "/frr-route-map:lib"
      checks:
        - path: 'frr-route-map:lib.route-map.#(name=="TEST").name'
          equals: TEST
        - path: 'frr-route-map:lib.route-map.#(name=="TEST").entry.#(sequence==10).action'
          equals: permit
        - path: 'frr-route-map:lib.route-map.#(name=="TEST").entry.#(sequence==10).match-condition.#(condition=="ipv4-prefix-list").rmap-match-condition.list-name'
          equals: TEST7
        - path: 'frr-route-map:lib.route-map.#(name=="TEST").entry.#(sequence==10).set-action.#(action=="set-metric").rmap-set-action.value'
          equals: "100"

  - type: createCandidate
    daemon: zebra
    description: |
      STEP 40

      Создание candidate transaction
      для добавления второго entry.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: candidate создается без data path; edit paths идут в следующем EditCandidate step.

      Аналог:
      vtysh:
      configure terminal

      grpcurl пример:
      grpcurl -plaintext -d '{}' localhost:50051 frr.Northbound/CreateCandidate
  - type: editCandidate
    daemon: zebra
    description: |
      STEP 41

      Добавление второго entry
      route-map TEST deny 20.

      Аналог:

      vtysh:
      route-map TEST deny 20


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/EditCandidate <<'JSON'
      {
        "candidateId": 1,
        "update": [
          {
            "path": "/frr-route-map:lib/route-map[name='TEST']/entry[sequence='20']/action",
            "value": "deny"
          }
        ],
        "note": "пример укорочен; полный update/delete смотри в params шага"
      }
      JSON
    params:
      update:
        - path: "/frr-route-map:lib/route-map[name='TEST']/entry[sequence='20']/action"
          value: deny

  - type: commitCandidate
    daemon: zebra
    description: |
      STEP 42

      Commit второго entry route-map.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: commit применяет candidate; data paths указаны в предыдущем EditCandidate step.

      Аналог:
      vtysh:
      end
      # изменения в vtysh применяются после config-команд

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Commit <<'JSON'
      {
        "candidateId": 1,
        "phase": "ALL",
        "comment": "add route-map deny 20"
      }
      JSON
    params:
      comment: add route-map deny 20

  - type: get
    daemon: zebra
    description: |
      STEP 43

      Проверка что route-map TEST
      содержит entries 10 и 20.

      Аналог:

      vtysh:
      show route-map


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Get <<'JSON'
      {
        "type": "CONFIG",
        "encoding": "JSON",
        "path": [
          "/frr-route-map:lib"
        ]
      }
      JSON
    params:
      requestType: 1
      path:
        - "/frr-route-map:lib"

  - type: assertJsonExists
    daemon: zebra
    description: |
      STEP 44

      Автоматическая проверка JSON дерева:
        - route-map TEST существует
        - entry 10 permit существует
        - entry 10 содержит match prefix-list TEST7
        - entry 10 содержит set metric 100
        - entry 20 deny существует


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      Аналог:
      нет отдельной команды; это автоматическая проверка результата Get/GetCapabilities.

      grpcurl пример:
      assert step не имеет отдельного RPC; эквивалентный grpcurl смотри в Get step рядом.
    params:
      requestType: 1
      path:
        - "/frr-route-map:lib"
      checks:
        - path: 'frr-route-map:lib.route-map.#(name=="TEST").name'
          equals: TEST
        - path: 'frr-route-map:lib.route-map.#(name=="TEST").entry.#(sequence==10).action'
          equals: permit
        - path: 'frr-route-map:lib.route-map.#(name=="TEST").entry.#(sequence==10).match-condition.#(condition=="ipv4-prefix-list").rmap-match-condition.list-name'
          equals: TEST7
        - path: 'frr-route-map:lib.route-map.#(name=="TEST").entry.#(sequence==10).set-action.#(action=="set-metric").rmap-set-action.value'
          equals: "100"
        - path: 'frr-route-map:lib.route-map.#(name=="TEST").entry.#(sequence==20).action'
          equals: deny

  - type: createCandidate
    daemon: zebra
    description: |
      STEP 47

      Создание candidate transaction
      для удаления entry 20.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: candidate создается без data path; edit paths идут в следующем EditCandidate step.

      Аналог:
      vtysh:
      configure terminal

      grpcurl пример:
      grpcurl -plaintext -d '{}' localhost:50051 frr.Northbound/CreateCandidate
  - type: editCandidate
    daemon: zebra
    description: |
      STEP 48

      Удаление entry 20
      из route-map TEST.

      Аналог:

      vtysh:
      no route-map TEST deny 20


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/EditCandidate <<'JSON'
      {
        "candidateId": 1,
        "delete": [
          {
            "path": "/frr-route-map:lib/route-map[name='TEST']/entry[sequence='20']"
          }
        ],
        "note": "пример укорочен; полный update/delete смотри в params шага"
      }
      JSON
    params:
      delete:
        - path: "/frr-route-map:lib/route-map[name='TEST']/entry[sequence='20']"

  - type: commitCandidate
    daemon: zebra
    description: |
      STEP 49

      Commit удаления entry 20.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: commit применяет candidate; data paths указаны в предыдущем EditCandidate step.

      Аналог:
      vtysh:
      end
      # изменения в vtysh применяются после config-команд

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Commit <<'JSON'
      {
        "candidateId": 1,
        "phase": "ALL",
        "comment": "delete route-map entry 20"
      }
      JSON
    params:
      comment: delete route-map entry 20

  - type: get
    daemon: zebra
    description: |
      STEP 50

      Проверка что entry 20
      удалился из route-map TEST.

      Аналог:

      vtysh:
      show route-map


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Get <<'JSON'
      {
        "type": "CONFIG",
        "encoding": "JSON",
        "path": [
          "/frr-route-map:lib"
        ]
      }
      JSON
    params:
      requestType: 1
      path:
        - "/frr-route-map:lib"

  - type: assertJsonMissing
    daemon: zebra
    description: |
      STEP 50.1

      Автоматическая проверка что entry 20
      удалился из route-map TEST.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      Аналог:
      нет отдельной команды; это автоматическая проверка результата Get/GetCapabilities.

      grpcurl пример:
      assert step не имеет отдельного RPC; эквивалентный grpcurl смотри в Get step рядом.
    params:
      requestType: 1
      path:
        - "/frr-route-map:lib"
      checks:
        - path: 'frr-route-map:lib.route-map.#(name=="TEST").entry.#(sequence==20).sequence'

  - type: assertJsonExists
    daemon: zebra
    description: |
      STEP 50.2

      Автоматическая проверка что entry 10
      остался в route-map TEST после удаления entry 20.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      Аналог:
      нет отдельной команды; это автоматическая проверка результата Get/GetCapabilities.

      grpcurl пример:
      assert step не имеет отдельного RPC; эквивалентный grpcurl смотри в Get step рядом.
    params:
      requestType: 1
      path:
        - "/frr-route-map:lib"
      checks:
        - path: 'frr-route-map:lib.route-map.#(name=="TEST").entry.#(sequence==10).action'
          equals: permit
        - path: 'frr-route-map:lib.route-map.#(name=="TEST").entry.#(sequence==10).match-condition.#(condition=="ipv4-prefix-list").rmap-match-condition.list-name'
          equals: TEST7
        - path: 'frr-route-map:lib.route-map.#(name=="TEST").entry.#(sequence==10).set-action.#(action=="set-metric").rmap-set-action.value'
          equals: "100"

  - type: createCandidate
    daemon: zebra
    description: |
      STEP 51

      Создание candidate transaction
      для удаления route-map TEST.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: candidate создается без data path; edit paths идут в следующем EditCandidate step.

      Аналог:
      vtysh:
      configure terminal

      grpcurl пример:
      grpcurl -plaintext -d '{}' localhost:50051 frr.Northbound/CreateCandidate
  - type: editCandidate
    daemon: zebra
    description: |
      STEP 52

      Удаление route-map TEST.

      Аналог:

      vtysh:
      no route-map TEST


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/EditCandidate <<'JSON'
      {
        "candidateId": 1,
        "delete": [
          {
            "path": "/frr-route-map:lib/route-map[name='TEST']"
          }
        ],
        "note": "пример укорочен; полный update/delete смотри в params шага"
      }
      JSON
    params:
      delete:
        - path: "/frr-route-map:lib/route-map[name='TEST']"

  - type: commitCandidate
    daemon: zebra
    description: |
      STEP 53

      Commit удаления route-map TEST.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: commit применяет candidate; data paths указаны в предыдущем EditCandidate step.

      Аналог:
      vtysh:
      end
      # изменения в vtysh применяются после config-команд

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Commit <<'JSON'
      {
        "candidateId": 1,
        "phase": "ALL",
        "comment": "delete route-map TEST"
      }
      JSON
    params:
      comment: delete route-map TEST

  - type: get
    daemon: zebra
    description: |
      STEP 54

      Проверка что route-map TEST
      полностью удалился.

      Аналог:

      vtysh:
      show route-map


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-route-map.yang
      root paths/libs:
      - /frr-route-map:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Get <<'JSON'
      {
        "type": "CONFIG",
        "encoding": "JSON",
        "path": [
          "/frr-route-map:lib"
        ]
      }
      JSON
    params:
      requestType: 1
      path:
        - "/frr-route-map:lib"

