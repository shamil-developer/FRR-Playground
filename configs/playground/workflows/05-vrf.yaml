---
steps:
  - type: get
    daemon: zebra
    description: |
      5. VRF CONFIG before

      Чтение VRF configuration до изменений.

      Аналог:

      vtysh:
      show vrf


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-vrf.yang
      root paths/libs:
      - /frr-vrf:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Get <<'JSON'
      {
        "type": "CONFIG",
        "encoding": "JSON",
        "path": [
          "/frr-vrf:lib"
        ]
      }
      JSON
    params:
      requestType: 1
      path:
        - "/frr-vrf:lib"
  - type: createCandidate
    daemon: zebra
    description: |
      5. VRF create candidate

      Создание candidate transaction.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: candidate создается без data path; edit paths идут в следующем EditCandidate step.

      Аналог:
      vtysh:
      configure terminal

      grpcurl пример:
      grpcurl -plaintext -d '{}' localhost:50051 frr.Northbound/CreateCandidate
  - type: editCandidate
    daemon: zebra
    description: |
      5. VRF create BLUE

      Создание VRF BLUE через northbound API.

      Аналог:

      vtysh:
      vrf BLUE


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-vrf.yang
      root paths/libs:
      - /frr-vrf:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/EditCandidate <<'JSON'
      {
        "candidateId": 1,
        "update": [
          {
            "path": "/frr-vrf:lib/vrf[name='BLUE']",
            "value": "{\n\"name\": \"BLUE\"\n}\n"
          }
        ],
        "note": "пример укорочен; полный update/delete смотри в params шага"
      }
      JSON
    params:
      update:
        - path: "/frr-vrf:lib/vrf[name='BLUE']"
          value: |
            {
            "name": "BLUE"
            }
  - type: commitCandidate
    daemon: zebra
    description: |
      5. VRF commit

      Commit candidate configuration.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: commit применяет candidate; data paths указаны в предыдущем EditCandidate step.

      Аналог:
      vtysh:
      end
      # изменения в vtysh применяются после config-команд

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Commit <<'JSON'
      {
        "candidateId": 1,
        "phase": "ALL",
        "comment": "create vrf BLUE"
      }
      JSON
    params:
      comment: create vrf BLUE
  - type: get
    daemon: zebra
    description: |
      5. VRF verify

      Проверка что VRF BLUE появился.

      Аналог:

      vtysh:
      show vrf


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-vrf.yang
      root paths/libs:
      - /frr-vrf:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Get <<'JSON'
      {
        "type": "CONFIG",
        "encoding": "JSON",
        "path": [
          "/frr-vrf:lib/vrf[name='BLUE']"
        ]
      }
      JSON
    params:
      requestType: 1
      path:
        - "/frr-vrf:lib/vrf[name='BLUE']"

  - type: assertJsonExists
    daemon: zebra
    description: |
      5. VRF create assert

      Автоматическая проверка что VRF BLUE
      появился в running configuration.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-vrf.yang
      root paths/libs:
      - /frr-vrf:lib

      Аналог:
      нет отдельной команды; это автоматическая проверка результата Get/GetCapabilities.

      grpcurl пример:
      assert step не имеет отдельного RPC; эквивалентный grpcurl смотри в Get step рядом.
    params:
      requestType: 1
      path:
        - "/frr-vrf:lib/vrf[name='BLUE']"
      checks:
        - path: 'frr-vrf:vrf.#(name=="BLUE").name'
          equals: BLUE

  - type: createCandidate
    daemon: zebra
    description: |
      5. VRF cleanup candidate

      Создание candidate transaction
      для удаления тестового VRF.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: candidate создается без data path; edit paths идут в следующем EditCandidate step.

      Аналог:
      vtysh:
      configure terminal

      grpcurl пример:
      grpcurl -plaintext -d '{}' localhost:50051 frr.Northbound/CreateCandidate
  - type: editCandidate
    daemon: zebra
    description: |
      5. VRF delete BLUE

      Удаление VRF BLUE через northbound API.

      Аналог:

      vtysh:
      no vrf BLUE

      После этого workflow должен вернуть
      состояние VRF config обратно.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-vrf.yang
      root paths/libs:
      - /frr-vrf:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/EditCandidate <<'JSON'
      {
        "candidateId": 1,
        "delete": [
          {
            "path": "/frr-vrf:lib/vrf[name='BLUE']"
          }
        ],
        "note": "пример укорочен; полный update/delete смотри в params шага"
      }
      JSON
    params:
      delete:
        - path: "/frr-vrf:lib/vrf[name='BLUE']"

  - type: commitCandidate
    daemon: zebra
    description: |
      5. VRF cleanup commit

      Commit удаления VRF BLUE.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-zebra.yang
      root paths/libs: commit применяет candidate; data paths указаны в предыдущем EditCandidate step.

      Аналог:
      vtysh:
      end
      # изменения в vtysh применяются после config-команд

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Commit <<'JSON'
      {
        "candidateId": 1,
        "phase": "ALL",
        "comment": "delete vrf BLUE"
      }
      JSON
    params:
      comment: delete vrf BLUE

  - type: get
    daemon: zebra
    description: |
      5. VRF cleanup verify

      Проверка VRF configuration после cleanup.

      Здесь читается весь VRF tree,
      чтобы глазами увидеть что BLUE отсутствует.

      Аналог:

      vtysh:
      show vrf


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-vrf.yang
      root paths/libs:
      - /frr-vrf:lib

      grpcurl пример:
      grpcurl -plaintext -d @ localhost:50051 frr.Northbound/Get <<'JSON'
      {
        "type": "CONFIG",
        "encoding": "JSON",
        "path": [
          "/frr-vrf:lib"
        ]
      }
      JSON
    params:
      requestType: 1
      path:
        - "/frr-vrf:lib"

  - type: assertJsonMissing
    daemon: zebra
    description: |
      5. VRF cleanup assert

      Автоматическая проверка что VRF BLUE
      отсутствует в running configuration после cleanup.


      Демон: zebra

      YANG/lib:
      endpoint: zebra / localhost:50051
      YANG modules:
      - frr-vrf.yang
      root paths/libs:
      - /frr-vrf:lib

      Аналог:
      нет отдельной команды; это автоматическая проверка результата Get/GetCapabilities.

      grpcurl пример:
      assert step не имеет отдельного RPC; эквивалентный grpcurl смотри в Get step рядом.
    params:
      requestType: 1
      path:
        - "/frr-vrf:lib"
      checks:
        - path: 'frr-vrf:lib.vrf.#(name=="BLUE").name'
