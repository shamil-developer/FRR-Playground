frr version 10.6
frr defaults traditional
hostname frr
service integrated-vtysh-config

log stdout

!
! Interfaces
!

interface lo
 ip address 1.1.1.1/32

interface eth0
 ip address 10.0.0.10/24

!
! Static routes
!

ip route 100.100.100.0/24 Null0
ip route 172.16.10.0/24 Null0
ip route 172.16.20.0/24 Null0
ip route 192.168.100.0/24 Null0

!
! Prefix lists
!

ip prefix-list PL-LOCAL seq 10 permit 1.1.1.1/32
ip prefix-list PL-LOCAL seq 20 permit 100.100.100.0/24
ip prefix-list PL-LOCAL seq 30 permit 172.16.0.0/16 le 24

ip prefix-list PL-DENY seq 10 deny 192.168.0.0/16 le 32
ip prefix-list PL-DENY seq 20 permit 0.0.0.0/0 le 32

!
! Community lists
!

bgp community-list standard CL-NOEXPORT permit no-export

!
! Route maps
!

route-map RM-IN permit 10
 match ip address prefix-list PL-DENY
 set local-preference 200

route-map RM-OUT permit 10
 match ip address prefix-list PL-LOCAL
 set metric 50
 set community no-export additive

route-map RM-STATIC permit 10
 match ip address prefix-list PL-LOCAL
 set origin igp

!
! BGP
!

router bgp 65001
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes

 neighbor 10.0.0.1 remote-as 65002
 neighbor 10.0.0.1 description ISP-1
 neighbor 10.0.0.1 timers 3 9

 neighbor 10.0.0.2 remote-as 65003
 neighbor 10.0.0.2 description ISP-2
 neighbor 10.0.0.2 timers 5 15

 !
 address-family ipv4 unicast

  network 1.1.1.1/32
  network 100.100.100.0/24

  redistribute static route-map RM-STATIC

  neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 soft-reconfiguration inbound
  neighbor 10.0.0.1 route-map RM-IN in
  neighbor 10.0.0.1 route-map RM-OUT out

  neighbor 10.0.0.2 activate
  neighbor 10.0.0.2 soft-reconfiguration inbound
  neighbor 10.0.0.2 route-map RM-IN in
  neighbor 10.0.0.2 route-map RM-OUT out

 exit-address-family
!
end